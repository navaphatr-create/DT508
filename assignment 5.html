<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมแตะวงกลม (Circle Touch Game)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #F8FAFC;
      --text-color: #334155;
      --accent-color: #3B82F6;
      --circle-color: #FF7171;
      --panel-bg: #FFFFFF;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Kanit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Fixed Layout Header */
    header {
      text-align: center;
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 15px 0;
      font-weight: 600;
      font-size: 2rem;
    }

    /* Stats Panel */
    .stats-panel {
      background: var(--panel-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .stats-container {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .stat-box {
      font-size: 1.2rem;
      font-weight: 500;
      text-align: center;
      flex: 1;
    }

    .stat-box span {
      font-weight: 600;
      font-size: 1.4rem;
      display: block;
    }

    #score { color: var(--accent-color); }
    #timer { color: #334155; }
    #pb-top { color: #10B981; }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      height: 50px; 
      margin-bottom: 20px;
    }

    button {
      font-family: 'Kanit', sans-serif;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0 40px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
      transition: all 0.2s;
      height: 100%;
      min-width: 200px;
    }

    button:hover:not(:disabled) {
      background-color: #2563EB;
      transform: translateY(-2px);
    }

    button:disabled {
      background-color: #94A3B8;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Game Container */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4/3;
      background: #CBD5E1; 
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }

    /* Timer Bar overlaid on the Camera */
    .timer-bar-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.3); /* Semi-transparent dark background */
      z-index: 20;
    }

    .timer-bar-fill {
      width: 100%;
      height: 100%;
      background-color: hsl(120, 80%, 50%); /* Start perfectly green */
      /* Smoothly transition both the length and the color */
      transition: width 1s linear, background-color 1s linear; 
    }

    /* Placeholder Text overlay */
    #placeholder-text {
      position: absolute;
      z-index: 10;
      font-size: 1.5rem;
      color: #475569;
      font-weight: 500;
      text-align: center;
      pointer-events: none;
    }

    video { display: none; } 

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0; 
      transition: opacity 0.3s ease;
      z-index: 5;
    }

    /* Bottom Scoreboard */
    .history-section {
      width: 100%;
      max-width: 800px;
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 40px;
    }

    .history-section h2 {
      margin: 0 0 15px 0;
      font-size: 1.4rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      border-bottom: 1px solid var(--border-color);
      font-size: 1.1rem;
    }
    
    .history-list li:last-child {
      border-bottom: none;
    }

    .history-list li .score-val {
      font-weight: 600;
      color: var(--accent-color);
    }
    
    .empty-history {
      text-align: center;
      color: #94A3B8;
      padding: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <h1>เกมแตะวงกลม</h1>
    
    <div class="stats-panel">
      <div class="stats-container">
        <div class="stat-box">เวลา<span id="timer">30</span></div>
        <div class="stat-box">คะแนน<span id="score">0</span></div>
        <div class="stat-box">สถิติสูงสุด<span id="pb-top">0</span></div>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn" disabled>กำลังโหลด AI...</button>
    </div>
  </header>

  <div id="game-container">
    <!-- Timer Bar is now inside the camera container -->
    <div class="timer-bar-bg">
      <div id="timer-fill" class="timer-bar-fill"></div>
    </div>
    
    <div id="placeholder-text">กำลังโหลดโมเดล AI...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="history-section">
    <h2>ประวัติการเล่น 10 ครั้งล่าสุด <span>PB: <span id="pb-bottom">0</span></span></h2>
    <ul class="history-list" id="history-list">
      <!-- History will be injected here -->
    </ul>
  </div>

  <script type="module">
    import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";
    const { HandLandmarker, FilesetResolver } = vision;

    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const startBtn = document.getElementById("start-btn");
    const placeholderText = document.getElementById("placeholder-text");
    
    // UI Elements
    const scoreElement = document.getElementById("score");
    const timerElement = document.getElementById("timer");
    const timerFill = document.getElementById("timer-fill");
    const pbTop = document.getElementById("pb-top");
    const pbBottom = document.getElementById("pb-bottom");
    const historyListUI = document.getElementById("history-list");

    let handLandmarker = undefined;
    let lastVideoTime = -1;
    let cameraActive = false;
    
    // Game State
    const GAME_DURATION = 30;
    let score = 0;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let isPlaying = false;
    let target = { x: 0, y: 0, radius: 40 };

    // Smoothing Variables (Anti-Blip)
    let lastLandmarks = null;
    let missingFrames = 0;
    const MAX_MISSING_FRAMES = 5;

    // Load Local Storage Data
    let personalBest = parseInt(localStorage.getItem("circleTouchPB")) || 0;
    let playHistory = JSON.parse(localStorage.getItem("circleTouchHistory")) || [];
    
    // Init UI from storage
    pbTop.innerText = personalBest;
    pbBottom.innerText = personalBest;
    renderHistory();

    const HAND_CONNECTIONS = [
      [0,1], [1,2], [2,3], [3,4],       
      [0,5], [5,6], [6,7], [7,8],       
      [5,9], [9,10], [10,11], [11,12],  
      [9,13], [13,14], [14,15], [15,16],
      [13,17], [17,18], [18,19], [19,20],
      [0,17]                            
    ];

    async function initializeAI() {
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );
      
      handLandmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });

      placeholderText.innerText = "รอการเปิดกล้อง...";
      startBtn.innerText = "เริ่มเกม";
      startBtn.disabled = false;
    }

    initializeAI();

    startBtn.addEventListener("click", () => {
      if (!handLandmarker) return;

      startBtn.disabled = true;
      startBtn.innerText = "กำลังเล่น...";

      // Reset Game Stats
      score = 0;
      timeLeft = GAME_DURATION;
      scoreElement.innerText = score;
      timerElement.innerText = timeLeft;
      
      // Reset Timer Bar Width and Color (Green)
      timerFill.style.width = "100%";
      timerFill.style.backgroundColor = "hsl(120, 80%, 50%)"; 
      isPlaying = true;

      if (!cameraActive) {
        placeholderText.innerText = "กำลังเชื่อมต่อกล้อง...";
        navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
          video.srcObject = stream;
          video.addEventListener("loadeddata", () => {
            cameraActive = true;
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
            
            placeholderText.style.display = "none";
            canvasElement.style.opacity = "1";
            
            startGameLoop();
            predictWebcam();
          });
        }).catch(err => {
          placeholderText.innerText = "ไม่สามารถเปิดกล้องได้";
          startBtn.disabled = false;
          startBtn.innerText = "ลองอีกครั้ง";
        });
      } else {
        startGameLoop();
      }
    });

    function startGameLoop() {
      spawnTarget();
      
      timerInterval = setInterval(() => {
        timeLeft--;
        timerElement.innerText = timeLeft;
        
        // Dynamic Color and Width calculation
        const percentage = (timeLeft / GAME_DURATION) * 100;
        
        // Calculate HSL Hue (Green is 120, Red is 0)
        // Multiplied by 1.2 so that 100% = 120 hue, 50% = 60 hue, 0% = 0 hue
        const dynamicHue = percentage * 1.2; 

        timerFill.style.width = `${percentage}%`;
        timerFill.style.backgroundColor = `hsl(${dynamicHue}, 80%, 50%)`;

        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      
      if (score > personalBest) {
        personalBest = score;
        localStorage.setItem("circleTouchPB", personalBest);
        pbTop.innerText = personalBest;
        pbBottom.innerText = personalBest;
        alert(`หมดเวลา! 🎉 ยินดีด้วย คุณได้สถิติใหม่: ${score} คะแนน!`);
      }

      const now = new Date();
      const timeString = `${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'})}`;
      
      playHistory.unshift({ score: score, date: timeString });
      if (playHistory.length > 10) {
        playHistory.pop(); 
      }
      localStorage.setItem("circleTouchHistory", JSON.stringify(playHistory));
      renderHistory();

      startBtn.disabled = false;
      startBtn.innerText = "เล่นอีกครั้ง";
    }

    function renderHistory() {
      historyListUI.innerHTML = "";
      if (playHistory.length === 0) {
        historyListUI.innerHTML = "<li class='empty-history'>ยังไม่มีประวัติการเล่น</li>";
        return;
      }

      playHistory.forEach((record, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${index + 1}. ${record.date}</span> <span class="score-val">${record.score} คะแนน</span>`;
        historyListUI.appendChild(li);
      });
    }

    function spawnTarget() {
      const margin = target.radius * 2;
      // We push the target's spawn area down slightly so it doesn't spawn directly under the timer bar
      const topMargin = margin + 20; 
      target.x = margin + Math.random() * (canvasElement.width - margin * 2);
      target.y = topMargin + Math.random() * (canvasElement.height - topMargin - margin);
    }

    function drawSkeleton(landmarks) {
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.6)"; 
      canvasCtx.fillStyle = "#3B82F6"; 

      for (const [startIdx, endIdx] of HAND_CONNECTIONS) {
        const p1 = landmarks[startIdx];
        const p2 = landmarks[endIdx];
        
        const x1 = (1 - p1.x) * canvasElement.width;
        const y1 = p1.y * canvasElement.height;
        const x2 = (1 - p2.x) * canvasElement.width;
        const y2 = p2.y * canvasElement.height;

        canvasCtx.beginPath();
        canvasCtx.moveTo(x1, y1);
        canvasCtx.lineTo(x2, y2);
        canvasCtx.stroke();
      }

      for (const p of landmarks) {
        const x = (1 - p.x) * canvasElement.width;
        const y = p.y * canvasElement.height;
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);
        canvasCtx.fill();
      }
    }

    async function predictWebcam() {
      if (!cameraActive) return;
      
      let startTimeMs = performance.now();
      let results = undefined;
      
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        results = handLandmarker.detectForVideo(video, startTimeMs);
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.restore();

      if (!isPlaying) {
        canvasCtx.fillStyle = "rgba(0, 0, 0, 0.5)";
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
      }

      let currentLandmarks = null;
      if (results && results.landmarks && results.landmarks.length > 0) {
        currentLandmarks = results.landmarks[0];
        lastLandmarks = currentLandmarks;
        missingFrames = 0;
      } else {
        if (lastLandmarks && missingFrames < MAX_MISSING_FRAMES) {
          currentLandmarks = lastLandmarks;
          missingFrames++;
        } else {
          lastLandmarks = null;
        }
      }

      if (currentLandmarks) {
        drawSkeleton(currentLandmarks);

        if (isPlaying) {
          const indexTip = currentLandmarks[8];
          const fingerX = (1 - indexTip.x) * canvasElement.width;
          const fingerY = indexTip.y * canvasElement.height;

          canvasCtx.beginPath();
          canvasCtx.arc(fingerX, fingerY, 14, 0, 2 * Math.PI);
          canvasCtx.fillStyle = "#10B981"; 
          canvasCtx.fill();
          canvasCtx.lineWidth = 2;
          canvasCtx.strokeStyle = "white";
          canvasCtx.stroke();

          const distance = Math.hypot(fingerX - target.x, fingerY - target.y);
          if (distance < target.radius) {
            score++;
            scoreElement.innerText = score;
            spawnTarget();
          }
        }
      }

      if (isPlaying) {
        canvasCtx.beginPath();
        canvasCtx.arc(target.x, target.y, target.radius, 0, 2 * Math.PI);
        canvasCtx.fillStyle = "rgba(255, 113, 113, 0.9)"; 
        canvasCtx.fill();
        canvasCtx.lineWidth = 4;
        canvasCtx.strokeStyle = "white";
        canvasCtx.stroke();
      }

      window.requestAnimationFrame(predictWebcam);
    }
  </script>
</body>
</html>
